<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Halal Haram</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#e8f7ef;--sf:#fff;--tx:#12302c;--pr:#0f8a6d;--pt:#fff;--ac:#ffc83d;--ok:#1d9a5b;--no:#e0533d;--bd:#b9dccd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f1b;--sf:#183029;--tx:#eaf6f1;--pr:#3fc9a4;--pt:#06241d;--bd:#2c4f45;--ok:#5fd596;--no:#ff8f7d}}
:root[data-theme="dark"]{--bg:#0e1f1b;--sf:#183029;--tx:#eaf6f1;--pr:#3fc9a4;--pt:#06241d;--bd:#2c4f45;--ok:#5fd596;--no:#ff8f7d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:800 18px/1.4 Nunito,system-ui,sans-serif;overflow-x:hidden}
h1,h2{font-family:"Baloo 2",system-ui,sans-serif;margin:0;line-height:1.1}
main{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:var(--sf);border:2px solid var(--bd);border-radius:99px;padding:4px 14px}
.card{background:var(--sf);border:3px solid var(--bd);border-radius:24px;padding:20px;margin-top:14px;text-align:center}
.mas{font-size:4.5rem;line-height:1;display:inline-block}
.mas.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-22px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.btn{border:0;border-radius:18px;padding:14px 22px;font:inherit;font-size:1.1rem;cursor:pointer;background:var(--ac);color:#3a2800;box-shadow:0 5px 0 rgba(0,0,0,.18);margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.h{background:var(--ok);color:#fff}.btn.x{background:var(--no);color:#fff}.btn.p{background:var(--pr);color:var(--pt)}
.btn:disabled{opacity:.5}
:focus-visible{outline:4px solid var(--ac);outline-offset:3px}
.item{font-size:5.5rem;line-height:1.1;margin:6px 0}
.name{font-size:1.5rem;font-family:"Baloo 2",sans-serif}
.fb{min-height:3.6em;margin:8px 0}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.bar{height:14px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.shake{animation:shake .35s}
.conf{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;animation:fall 2.4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.stars{font-size:2.6rem;letter-spacing:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top"><h1 style="font-size:1.5rem">Petualangan Halal Haram</h1><div><span class="chip" id="sc">⭐ 0</span> <button class="chip" id="snd" aria-pressed="true" aria-label="Suara">🔊</button></div></div>
<div id="app"></div>
</main>
<script>
const G1=[["🍎","Apel segar",1,"Buah apel zatnya baik dan halal."],["🥛","Susu sapi",1,"Susu sapi halal diminum."],["🐟","Ikan goreng",1,"Ikan halal dimakan."],["🐖","Daging babi",0,"Babi haram karena zat asalnya."],["🥚","Telur ayam",1,"Telur ayam halal."],["🩸","Darah",0,"Darah haram karena zat asalnya."],["🎲","Uang hasil judi",0,"Judi sifatnya buruk, hasilnya haram."],["🍪","Kue dibeli dengan uang jujur",1,"Zatnya halal, caranya baik."],["🍺","Minuman keras",0,"Memabukkan dan dilarang Allah."],["🐄","Daging sapi disembelih dengan bismillah",1,"Zat halal, cara menyembelih benar."],["💰","Uang hasil mencuri",0,"Cara mendapatkannya salah, jadi haram."],["🦴","Bangkai ayam",0,"Bangkai haram karena zat asalnya."]];
const G2=[["🐖","Daging babi",0,"Zat asal: dari bendanya sudah haram."],["🎰","Berjudi",1,"Sifat asal: perbuatannya sendiri sudah buruk."],["🐄","Sapi hasil mencuri",2,"Cara atau proses: sapinya halal, tapi didapat dengan mencuri."],["🩸","Darah",0,"Zat asal: bendanya haram."],["⚖️","Menipu timbangan saat jualan",2,"Cara atau proses mendapatkan rezeki yang salah."],["🗿","Menyembah berhala",1,"Sifat asal: perbuatan yang dilarang tegas."],["💼","Korupsi uang",2,"Cara atau proses: mengambil yang bukan hak."],["🦴","Bangkai",0,"Zat asal: bendanya haram."]];
const $=s=>document.querySelector(s);
let score=0,on=true,ac;
function snd(f,d,t="sine",v=.15,when=0){if(!on)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+when+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+when);o.stop(ac.currentTime+when+d)}catch(e){}}
const good=()=>{snd(660,.15);snd(880,.2,"sine",.15,.12)},bad=()=>snd(160,.35,"sawtooth",.1),win=()=>[523,659,784,1046].forEach((f,i)=>snd(f,.25,"triangle",.15,i*.14));
$("#snd").onclick=e=>{on=!on;e.target.textContent=on?"🔊":"🔇";e.target.setAttribute("aria-pressed",on)};
const say=t=>{if(!on||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.95;speechSynthesis.speak(u)}catch(e){}};
function conf(){["🎉","⭐","🌟","✨","🎊"].forEach((e,k)=>{for(let i=0;i<5;i++){const s=document.createElement("span");s.className="conf";s.textContent=e;s.style.left=Math.random()*95+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3500)}})}
function menu(){$("#app").innerHTML=`<div class="card"><div class="mas hop">🐥</div><h2>Halo, teman hebat!</h2><p>Aku Si Kuning. Ayo bantu aku memilih yang boleh dan tidak boleh menurut Islam.</p>
<div class="row"><button class="btn h" id="g1">🧺 Game 1: Halal atau Haram?</button><button class="btn p" id="g2">🔍 Game 2: Detektif Sebab</button></div>
<p style="font-size:.9rem;opacity:.8">Tip: nyalakan suara agar lebih seru. Mainkan bersama temanmu!</p></div>`;
$("#g1").onclick=()=>run(G1,1);$("#g2").onclick=()=>run(G2,2)}
function run(L,mode){let i=0,ok=0,lock=false;const D=[...L].sort(()=>Math.random()-.5);
function q(){lock=false;const [e,n]=D[i];
const btns=mode==1?`<button class="btn h" data-a="1">✅ HALAL</button><button class="btn x" data-a="0">❌ HARAM</button>`:`<button class="btn p" data-a="0">🧱 Zat asal</button><button class="btn h" data-a="1">💡 Sifat asal</button><button class="btn x" data-a="2">🛤️ Cara / proses</button>`;
$("#app").innerHTML=`<div class="card"><div class="bar"><i style="width:${i/D.length*100}%"></i></div><div class="meta">Soal ${i+1} dari ${D.length}</div>
<div class="mas" id="ms">🐥</div><div class="item" aria-hidden="true">${e}</div><div class="name">${n}</div>
<p>${mode==1?"Menurutmu, ini halal atau haram?":"Apa penyebab hukumnya?"}</p><div class="row">${btns}</div><div class="fb" id="fb" aria-live="polite"></div><div class="row"><button class="btn" id="nx" hidden>Lanjut ➜</button></div></div>`;
say(n);
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const r=+b.dataset.a===D[i][2];const f=$("#fb");
if(r){ok++;score+=10;good();$("#ms").classList.add("hop");f.className="fb ok";f.textContent="Betul! "+D[i][3]}else{bad();$("#app .card").classList.add("shake");f.className="fb no";f.textContent="Belum tepat. "+D[i][3]}
$("#sc").textContent="⭐ "+score;say(f.textContent);$("#nx").hidden=false;$("#nx").textContent=i==D.length-1?"Lihat hasil 🏆":"Lanjut ➜";$("#nx").focus()});
$("#nx").onclick=()=>{if(i==D.length-1)end();else{i++;q()}}}
function end(){const p=ok/D.length,st=p>=.9?3:p>=.6?2:1;win();if(p>=.6)conf();
$("#app").innerHTML=`<div class="card"><div class="mas hop">${st==3?"🏆":"🐥"}</div><h2>${st==3?"Hebat sekali!":st==2?"Bagus!":"Ayo coba lagi!"}</h2><div class="stars" aria-label="${st} bintang">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
<p>Kamu benar ${ok} dari ${D.length} soal.</p><p>Ingat: pilihlah yang halal, tinggalkan yang haram, dan cari rezeki dengan cara yang baik.</p>
<div class="row"><button class="btn p" id="ag">🔄 Main lagi</button><button class="btn" id="mn">🏠 Menu</button></div></div>`;
$("#ag").onclick=()=>run(L,mode);$("#mn").onclick=menu}
q()}
menu();
</script>
</body>
</html>
